<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Professional LED control application with Bluetooth connectivity"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>LED Control Pro</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="assets/icon-192x192.png"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/responsive-fix.css" />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <canvas id="background-canvas"></canvas>

    <!-- Startscreen -->
    <div id="startscreen">
      <div class="title">
        LIGHTS SPACE
        <span class="line2">WORLD</span>
      </div>
      <div class="subtitle">LED-App der nächsten Generation</div>
    </div>

    <!-- Appscreen -->
    <div id="appscreen" style="display: none">
      <div class="content-area">
        <div class="app-container">
          <div class="iframe-container">
            <iframe
              class="app-iframe"
              id="app-iframe"
              title="LED Control App"
            ></iframe>
          </div>
        </div>
      </div>

      <div class="nav-bar">
        <button type="button" class="nav-item" data-app="farbe">
          <i class="fas fa-palette"></i>
          <span class="nav-item-text">Farbe</span>
        </button>
        <button type="button" class="nav-item" data-app="effekt">
          <i class="fas fa-magic"></i>
          <span class="nav-item-text">Effekte</span>
        </button>
        <button type="button" class="nav-item" data-app="musik">
          <i class="fas fa-music"></i>
          <span class="nav-item-text">Musik</span>
        </button>
        <button type="button" class="nav-item" data-app="timer">
          <i class="fas fa-clock"></i>
          <span class="nav-item-text">Timer</span>
        </button>
        <button type="button" class="nav-item" data-app="einstellungen">
          <i class="fas fa-cog"></i>
          <span class="nav-item-text">Einstellungen</span>
        </button>
      </div>
    </div>

    <!-- Capacitor Core (must load before app.js) -->
    <script src="https://unpkg.com/@capacitor/core@7.4.4/dist/capacitor.js"></script>

    <!-- Notification System (load first) -->
    <script src="js/notifications.js"></script>

    <!-- Permissions Handler -->
    <script src="js/permissions-handler.js"></script>
    <script src="js/android-permissions-manager.js"></script>
    <script src="js/permissions-sequencer.js"></script>

    <!-- i18n System (load early) -->
    <script src="js/i18n.js"></script>

    <!-- Umlaut-Fixer (korrigiert UE→Ü, AE→Ä, OE→Ö automatisch) -->
    <script src="js/umlaut-fixer.js"></script>

    <!-- Toggle-Switch-Manager (Gelb=An, Schwarz=Aus) -->
    <script src="js/toggle-switch-manager.js"></script>

    <!-- Complete-UI-Fix (ALLE UI-Probleme: Switches, Slider, Bluetooth, Musik) -->
    <script src="js/complete-ui-fix.js"></script>

    <!-- Startup-Permissions (Berechtigungen beim App-Start) -->
    <script src="js/startup-permissions.js"></script>

    <!-- LED-Sidebar-Swipe (von links wischen) -->
    <script src="js/led-sidebar-swipe.js"></script>

    <!-- Slider-Live-Values (Werte bewegen sich mit Slider) -->
    <script src="js/slider-live-values.js"></script>

    <!-- UI-Cleanup-Manager (entfernt überflüssige Buttons/Texte) -->
    <script src="js/ui-cleanup-manager.js"></script>

    <!-- Multi-Language-Support (DE, EN, ES, FR) -->
    <script src="js/multi-language-support.js"></script>

    <!-- BLE-Error-Fixer (behebt BLE-Init Fehler) -->
    <script src="js/ble-error-fixer.js"></script>

    <!-- Visualization-Manager (Musik-Visualisierung ohne schwarzen Bildschirm) -->
    <script src="js/visualization-manager.js"></script>

    <!-- Title-Style-Unifier (alle Titel im Timer-Design) -->
    <script src="js/title-style-unifier.js"></script>

    <!-- Auto-Start Manager -->
    <script src="js/auto-start-manager.js"></script>

    <!-- Bluetooth & Audio Core -->
    <script src="js/bluetooth-foreground-service.js"></script>
    <script src="js/audio-decoder-fft.js"></script>
    <script src="js/android-music-scanner.js"></script>
    <script src="js/library-auto-scanner.js"></script>

    <!-- Core Modules (load before app.js) -->
    <script src="js/utils.js"></script>
    <script src="js/ble-controller-pro.js"></script>
    <script src="js/led-auto-scanner.js"></script>
    <script src="js/event-manager.js"></script>
    <script src="js/performance-optimizer.js"></script>
    <script src="js/led-abstraction-layer.js"></script>
    <script src="js/device-manager.js"></script>
    <script src="js/led-sidebar.js"></script>

    <!-- Global Error Handler & Loading Manager -->
    <script src="js/global-error-handler.js"></script>
    <script src="js/loading-manager.js"></script>

    <!-- App JavaScript (Main) -->
    <script src="js/app.js"></script>

    <!-- Globale Module (für alle Seiten) -->
    <script src="js/capacitor-adapter.js"></script>
    <script src="js/native-bridge.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
      <script src="js/animation-system.js"></script>
    <script src="js/gesture-controls.js"></script>
    <script src="js/performance-monitor.js"></script>
    <script src="js/input-validator.js"></script>
    <script src="js/quick-actions.js"></script>
    <script src="js/scenes-manager.js"></script>
    <script src="js/voice-commands.js"></script>
    <script src="js/preset-manager.js"></script>
    <script src="js/led-custom-names.js"></script>
    <script src="js/sonderzeichen-replacer.js"></script>
</body>
</html>
