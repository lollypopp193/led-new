<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Professional LED control application with Bluetooth connectivity"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>LED Control Pro</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="assets/icon-192x192.png"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <canvas id="background-canvas"></canvas>

    <!-- Startscreen -->
    <div id="startscreen">
      <div class="title">
        LIGHTS SPACE
        <span class="line2">WORLD</span>
      </div>
      <div class="subtitle">LED-App der nächsten Generation</div>
    </div>

    <!-- Appscreen -->
    <div id="appscreen" style="display: none">
      <div class="content-area">
        <div class="app-container">
          <div class="iframe-container">
            <iframe
              class="app-iframe"
              id="app-iframe"
              title="LED Control App"
            ></iframe>
          </div>
        </div>
      </div>

      <div class="nav-bar">
        <button type="button" class="nav-item" data-app="farbe">
          <i class="fas fa-palette"></i>
          <span class="nav-item-text">Farbe</span>
        </button>
        <button type="button" class="nav-item" data-app="effekt">
          <i class="fas fa-magic"></i>
          <span class="nav-item-text">Effekte</span>
        </button>
        <button type="button" class="nav-item" data-app="musik">
          <i class="fas fa-music"></i>
          <span class="nav-item-text">Musik</span>
        </button>
        <button type="button" class="nav-item" data-app="timer">
          <i class="fas fa-clock"></i>
          <span class="nav-item-text">Timer</span>
        </button>
        <button type="button" class="nav-item" data-app="einstellungen">
          <i class="fas fa-cog"></i>
          <span class="nav-item-text">Einstellungen</span>
        </button>
      </div>
    </div>

    <!-- Capacitor Core (must load before app.js) -->
    <script src="https://unpkg.com/@capacitor/core@7.4.4/dist/capacitor.js"></script>

    <!-- Notification System (load first) -->
    <script src="js/core/notifications.js"></script>

    <!-- Permissions Handler -->
    <script src="js/utils/permissions-handler.js"></script>
    <script src="js/utils/android-permissions-manager.js"></script>
    <script src="js/utils/permissions-sequencer.js"></script>

    <!-- i18n System (load early) -->
    <script src="js/core/i18n.js"></script>

    <!-- Umlaut-Fixer (korrigiert UE→Ü, AE→Ä, OE→Ö automatisch) -->
    <script src="js/ui/umlaut-fixer.js"></script>

    <!-- Toggle-Switch-Manager (Gelb=An, Schwarz=Aus) -->
    <script src="js/ui/toggle-switch-manager.js"></script>

    <!-- Startup-Permissions (Berechtigungen beim App-Start) -->
    <script src="js/utils/startup-permissions.js"></script>

    <!-- LED-Sidebar-Swipe (von links wischen) -->
    <script src="js/led/led-sidebar-swipe.js"></script>

    <!-- Musik-Bibliothek-Navigation (Interpreten→Lieder) -->
    <script src="js/musik/music-library-navigation.js"></script>

    <!-- Playlist-Manager (Erstellen, Löschen, Import/Export) -->
    <script src="js/musik/playlist-manager.js"></script>

    <!-- Slider-Live-Values (Werte bewegen sich mit Slider) -->
    <script src="js/ui/slider-live-values.js"></script>

    <!-- UI-Cleanup-Manager (entfernt überflüssige Buttons/Texte) -->
    <script src="js/ui/ui-cleanup-manager.js"></script>

    <!-- Multi-Language-Support (DE, EN, ES, FR) -->
    <script src="js/ui/multi-language-support.js"></script>

    <!-- BLE-Error-Fixer (behebt BLE-Init Fehler) -->
    <script src="js/bluetooth/ble-error-fixer.js"></script>

    <!-- Visualization-Manager (Musik-Visualisierung ohne schwarzen Bildschirm) -->
    <script src="js/musik/visualization-manager.js"></script>

    <!-- Title-Style-Unifier (alle Titel im Timer-Design) -->
    <script src="js/ui/title-style-unifier.js"></script>

    <!-- Auto-Start Manager -->
    <script src="js/utils/auto-start-manager.js"></script>

    <!-- Bluetooth & Audio Core -->
    <script src="js/bluetooth/bluetooth-foreground-service.js"></script>
    <script src="js/musik/audio-decoder-fft.js"></script>
    <script src="js/musik/android-music-scanner.js"></script>

    <!-- Preset-System & MediaStore -->
    <script src="js/led/preset-manager.js"></script>
    <script src="js/musik/mediastore-bridge.js"></script>
    <script src="js/musik/musik-master-fixes.js"></script>

    <!-- Core Modules (load before app.js) -->
    <script src="js/bluetooth/ble-controller-pro.js"></script>
    <script src="js/led/led-auto-scanner.js"></script>
    <script src="js/core/event-manager.js"></script>
    <script src="js/utils/performance-optimizer.js"></script>
    <script src="js/led/led-abstraction-layer.js"></script>
    <script src="js/led/scenes-manager.js"></script>
    <script src="js/musik/audio-reactive-engine.js"></script>
    <script src="js/bluetooth/device-manager.js"></script>
    <script src="js/musik/music-library-manager.js"></script>
    <script src="js/musik/musik-integration.js"></script>
    <script src="js/musik/equalizer-engine.js"></script>
    <script src="js/musik/equalizer-ui-integration.js"></script>
    <script src="js/musik/bassboost-controller.js"></script>
    <script src="js/musik/crossfade-controller.js"></script>
    <script src="js/musik/bpm-analyzer.js"></script>
    <script src="js/controllers/sleep-timer-controller.js"></script>
    <script src="js/controllers/sleep-timer-ui-controller.js"></script>
    <script src="js/musik/music-alarm-controller.js"></script>
    <script src="js/musik/crossfade-slider-fix.js"></script>
    <script src="js/musik/library-auto-scanner.js"></script>
    <script src="js/musik/library-search-filter.js"></script>
    <script src="js/musik/playlist-import-export.js"></script>
    <script src="js/ui/sonderzeichen-replacer.js"></script>
    <script src="js/led/led-sidebar.js"></script>

    <!-- Global Error Handler & Loading Manager -->
    <script src="js/core/global-error-handler.js"></script>
    <script src="js/core/loading-manager.js"></script>

    <!-- SESSION 2: New Features -->
    <script src="js/musik/playlist-drag-drop.js"></script>
    <script src="js/led/led-custom-names.js"></script>
    <script src="js/ui/input-validator.js"></script>

    <!-- SESSION 3: Animations & Polish -->
    <script src="js/core/animation-system.js"></script>

    <!-- SESSION 4: Native Features & Performance -->
    <script src="js/musik/media-session-controller.js"></script>
    <script src="js/led/quick-actions.js"></script>
    <script src="js/utils/performance-monitor.js"></script>

    <!-- SESSION 5: Final Features -->
    <script src="js/utils/cloud-sync.js"></script>
    <script src="js/musik/advanced-visualizer.js"></script>
    <script src="js/ui/gesture-controls.js"></script>
    <script src="js/musik/voice-commands.js"></script>
    <script src="js/musik/share-manager.js"></script>

    <!-- App JavaScript (Main) -->
    <script src="js/core/app.js"></script>

    <!-- Globale Module (für alle Seiten) -->
    <!-- global-error-handler.js - bereits geladen -->
    <!-- loading-manager.js - bereits geladen -->
    <!-- startup-permissions.js - bereits geladen -->
    <!-- notifications.js - bereits geladen -->
    <script src="js/core/capacitor-adapter.js"></script>
    <script src="js/core/native-bridge.js"></script>
    <!-- event-manager.js - bereits geladen -->
    <!-- animation-system.js - bereits geladen -->
    <!-- performance-optimizer.js - bereits geladen -->
    <!-- i18n.js - bereits geladen -->
    <!-- auto-start-manager.js - bereits geladen -->
    <script src="js/utils/edge-case-tester.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
